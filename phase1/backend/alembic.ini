# A generic single-database configuration.
[alembic]

# 迁移脚本存放路径
script_location = alembic

# 日志配置
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 日期格式
timezone = Asia/Shanghai

# sqlalchemy.url 会由 env.py 中的 settings.sync_database_url 覆盖
# 这里仅作为占位，确保离线模式可读
sqlalchemy.url = mysql+pymysql://eqa_user:eqa_password_2024@localhost:3306/enterprise_qa

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
