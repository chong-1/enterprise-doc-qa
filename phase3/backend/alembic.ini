# A generic single-database configuration.
[alembic]

# Alembic migration script location
script_location = alembic

# Logging config
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Date format
timezone = Asia/Shanghai

# sqlalchemy.url is overridden by env.py using settings.sync_database_url.
# This placeholder keeps offline mode readable.
sqlalchemy.url = mysql+pymysql://eqa_user:eqa_password_2024@localhost:3306/enterprise_qa

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
