# ========== Redis 配置文件 ==========

# 保护模式（Docker 内部网络可关闭）
protected-mode no

# 绑定地址（仅本地访问）
bind 0.0.0.0

# 端口
port 6379

# 持久化：RDB 快照
save 900 1
save 300 10
save 60 10000

# 持久化目录
dir /data
dbfilename dump.rdb

# 日志
loglevel notice
logfile ""

# 最大内存
maxmemory 256mb

# 淘汰策略：LRU
maxmemory-policy allkeys-lru

# 连接数上限
maxclients 1000
