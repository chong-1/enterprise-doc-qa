# ========== 开发环境 Docker Compose ==========
# 启动: docker compose -f docker/docker-compose.yml up -d
# 停止: docker compose -f docker/docker-compose.yml down
# 清理: docker compose -f docker/docker-compose.yml down -v

services:
  mysql:
    image: mysql:8.0
    container_name: eqa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enterprise_qa}
      MYSQL_USER: ${MYSQL_USER:-eqa_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eqa_password_2024}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eqa-network

  redis:
    image: redis:7-alpine
    container_name: eqa-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eqa-network

  # 可选：对象存储，开发期可注释掉，改用本地文件系统
  minio:
    image: minio/minio:latest
    container_name: eqa-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eqa-network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  eqa-network:
    driver: bridge
